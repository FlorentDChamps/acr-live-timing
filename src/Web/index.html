<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #263041; --txt: #e6edf3;
    --dim: #8b949e; --accent: #a33a43; --accent-contrast: #fff;
    --sub: #c96a72; --ok: #3fb950;
    /* near-white grey for penalty (italic) times: readable, just off the main text */
    --faint: #d9e0e8;
    --gold: #f2b705; --silver: #94a3b8; --bronze: #e08b43;
    --scroll-track: #111720; --scroll-thumb: #3a4657; --scroll-thumb-hover: #58677a;
    /* pinned column widths (border-box, so offsets = cumulative widths) */
    --w-pos: 46px; --w-name: 200px; --w-time: 116px;
    /* overlay background opacity (0..1); set per-overlay via the ?bg= param / host JS */
    --ov-alpha: 0.8;
  }
  /* System is the default. A viewer can pin either palette from Settings. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f5f4; --panel: #fffdfc; --line: #ddd6d4; --txt: #251f20;
      --dim: #6d6263; --accent: #a33a43; --accent-contrast: #fff;
      --sub: #ad4f58; --ok: #217a4b; --faint: #665d5e;
      --gold: #f2b705; --silver: #94a3b8; --bronze: #e08b43;
      --scroll-track: #f0ebea; --scroll-thumb: #bbb1ae; --scroll-thumb-hover: #918684;
    }
  }
  body[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --line: #263041; --txt: #e6edf3;
    --dim: #8b949e; --accent: #a33a43; --accent-contrast: #fff;
    --sub: #c96a72; --ok: #3fb950; --faint: #d9e0e8;
    --gold: #f2b705; --silver: #94a3b8; --bronze: #e08b43;
    --scroll-track: #111720; --scroll-thumb: #3a4657; --scroll-thumb-hover: #58677a;
  }
  body[data-theme="light"] {
    --bg: #f7f5f4; --panel: #fffdfc; --line: #ddd6d4; --txt: #251f20;
    --dim: #6d6263; --accent: #a33a43; --accent-contrast: #fff;
    --sub: #ad4f58; --ok: #217a4b; --faint: #665d5e;
    --gold: #f2b705; --silver: #94a3b8; --bronze: #e08b43;
    --scroll-track: #f0ebea; --scroll-thumb: #bbb1ae; --scroll-thumb-hover: #918684;
  }
  html { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
         font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  /* The normal page is a full-height application shell. Its content pane scrolls
     the page chrome away first; the footer stays outside it and therefore visible. */
  body:not(.overlay) { height: 100vh; height: 100dvh; overflow: hidden;
                       display: flex; flex-direction: column; }
  body:not(.overlay) > .page-content { flex: 1 1 auto; min-height: 0;
                                       overflow-y: auto; overflow-x: hidden;
                                       scrollbar-width: none; }
  /* This pane only carries the initial page-chrome travel. Hide its native rail so
     the table's vertical scrollbar is the single visible scrolling control. */
  body:not(.overlay) > .page-content::-webkit-scrollbar { display: none; }
  body:not(.overlay) > footer { flex: none; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  /* app icon beside the title; the header row aligns on baselines, so the image
     centers itself instead. Its src is the favicon's data URI, set from JS, so
     the artwork is embedded once. Negative margin tightens the icon-title pair
     against the header's uniform gap. */
  #logo { align-self: center; display: block; margin-right: -6px; }
  .meta { color: var(--dim); font-size: 13px; }
  /* GitHub link: neutral pill fixed beside the gear button (same top/height, 8px
     gap => right = 12 + 34 + 8). Lives inside <header>, so overlay mode hides it
     with the rest for free (display:none on the parent beats position:fixed). */
  .ghlink { position: fixed; top: 10px; right: 96px; z-index: 20; height: 34px;
            display: inline-flex; align-items: center; gap: 7px;
            padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--panel); color: var(--dim); font-size: 13px;
            text-decoration: none; white-space: nowrap; }
  .ghlink:hover { border-color: var(--accent); color: var(--txt); }
  .ghlink svg { flex: none; }
  /* operator-set page title + description: own full-width row inside the header,
     just under the "ACR Live Timing" / status line */
  .pageinfo { flex-basis: 100%; margin-top: -8px; }
  .pagetitle { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .pagedesc { color: var(--dim); font-size: 13px; margin-top: 4px;
              white-space: pre-wrap; overflow-wrap: anywhere; }
  .pagetitle a, .pagedesc a { color: var(--accent); text-decoration: underline; }
  .pagetitle a { color: inherit; }
  /* current-stage bar: phase badge + stage name + start time / length.
     Sits BELOW the header's separator line, as its own row. */
  .stagebar { padding: 12px 20px 0; display: flex; align-items: center; gap: 22px;
              flex-wrap: wrap; }
  .phasebadge { font-size: 12px; font-weight: 700; letter-spacing: .5px;
                text-transform: uppercase; padding: 2px 12px; border-radius: 10px;
                background: var(--panel); border: 1px solid var(--line);
                color: var(--dim); white-space: nowrap;
                /* fixed width (fits the longest label, "LOADING NEXT STAGE") so the
                   bar never shifts and the status always stays on one line */
                width: 190px; text-align: center; box-sizing: border-box; }
  .phasebadge.racing { background: var(--ok); border-color: var(--ok); color: #0e1116; }
  .phasebadge.results { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  @media (prefers-color-scheme: light) {
    body:not([data-theme]) .phasebadge.racing { color: var(--accent-contrast); }
  }
  body[data-theme="light"] .phasebadge.racing { color: var(--accent-contrast); }
  .curstage { font-weight: 600; font-size: 14px; }
  /* live stage progression. Fixed mode (default): the window always spans the
     configured range, right edge on the leader (km figure beside the track).
     Auto-fit mode: the left edge is the last running car, so the range stretches
     to fit the field, the configured value capping the span. Either way cars
     further back than the window are hidden. Finished cars pin the right edge
     (the stage end stops moving); only DNF/retired cars are kept off the edges. */
  .progwrap { padding: 12px 20px 0; display: flex; align-items: center; gap: 12px; }
  .progtrack { position: relative; flex: 1; height: 84px; background: var(--panel);
               border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .progline { position: absolute; left: 0; right: 0; top: 50%; height: 2px;
              margin-top: -1px; background: var(--line); }
  .progcar { position: absolute; top: 50%; width: 12px; height: 12px;
             border-radius: 50%; transform: translate(-50%, -50%);
             border: 2px solid var(--bg); box-sizing: border-box;
             transition: left .9s linear; z-index: 1; }
  .progcar.fin { border-radius: 2px; }          /* square = crossed the line */
  .progcar.out { opacity: .35; }                /* retired / disqualified */
  .progcar.anon { opacity: .55; }               /* unidentified car: dot only, no label */
  .proglbl { position: absolute; transform: translateX(-50%); font-size: 10px;
             line-height: 1.1; color: var(--txt); white-space: nowrap;
             transition: left .9s linear; }
  /* 4 label rows (2 above, 2 below the line) so clustered markers stay readable */
  .proglbl.t1 { top: 5px; }  .proglbl.t2 { top: 19px; }
  .proglbl.b1 { bottom: 5px; } .proglbl.b2 { bottom: 19px; }
  .proglbl.ph { color: var(--dim); font-style: italic; }  /* unidentified car */
  /* leader's absolute km, to the RIGHT of the track (= right edge of the window) */
  .progkm { font-size: 13px; font-weight: 700; color: var(--txt);
            min-width: 62px; white-space: nowrap; }
  .progkm small { display: block; font-size: 9px; font-weight: 400;
                  color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
  /* current window span ("−2 km"), bottom-left corner of the track */
  /* z-index over the labels (which are appended after it): the JS keeps the b1 row
     clear of this corner, but on a layout it can't predict the figure still wins */
  .proglo { position: absolute; left: 6px; bottom: 3px; font-size: 9px;
            color: var(--dim); z-index: 2; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: var(--dim); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .wrap { padding: 16px 20px 0; }
  /* The board bar reaches the top only after the page header/progression has
     scrolled away; it then stays there while the table rows continue below it. */
  body:not(.overlay) .boardbar { position: sticky; top: 0; z-index: 4;
                                  margin-bottom: 0; padding-bottom: 10px; background: var(--bg); }
  /* Mirror the table's bottom rail just above the always-visible footer. It stays
     available while rows scroll, but appears only when the columns overflow. */
  .table-hscroll { position: fixed; left: 20px; right: 20px; bottom: var(--footer-height, 0px); z-index: 10;
                   height: 14px; margin: 0; overflow-x: scroll; overflow-y: hidden;
                   scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track);
                   background: var(--scroll-track); border-radius: 4px; }
  .table-hscroll-inner { height: 1px; }
  .table-hscroll::-webkit-scrollbar { height: 8px; }
  .table-hscroll::-webkit-scrollbar-track { background: var(--scroll-track); }
  .table-hscroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 2px solid var(--scroll-track); border-radius: 999px; }
  .table-hscroll::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  /* The table gets a dedicated viewport: rows scroll vertically and the native
     horizontal scrollbar remains attached to its bottom edge. */
  .table-scroll { max-height: min(640px, 62vh); overflow: auto; scrollbar-gutter: stable;
                  scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track); }
  .table-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--scroll-track); }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 2px solid var(--scroll-track);
                                            border-radius: 999px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  .table-scroll::-webkit-scrollbar-corner { background: var(--scroll-track); }
  body:not(.overlay) .table-scroll { height: var(--table-viewport-height, min(640px, 62vh)); max-height: none; }
  table { border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: right; white-space: nowrap;
           border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--dim); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: .4px; line-height: 1.3;
       vertical-align: middle;
       position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .sorthead { width: 100%; padding: 0; border: 0; background: transparent;
              color: inherit; font: inherit; text-align: inherit;
              text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
  .sorthead:hover { color: var(--txt); }

  /* fixed-width time columns (stage cells + Total) */
  .cell, .total { width: var(--w-time); min-width: var(--w-time);
                  max-width: var(--w-time); }

  /* left-pinned block: #, Driver, Total — stay put while stages scroll */
  th.pos,  td.pos  { position: sticky; left: 0;
                     width: var(--w-pos); min-width: var(--w-pos); max-width: var(--w-pos); }
  th.name, td.name { position: sticky; left: var(--w-pos); text-align: left;
                     width: var(--w-name); min-width: var(--w-name); max-width: var(--w-name);
                     overflow: hidden; text-overflow: ellipsis; }
  th.total, td.total { position: sticky; left: calc(var(--w-pos) + var(--w-name)); }
  th.pos, td.pos, th.name, td.name, th.total, td.total {
    background: var(--bg); z-index: 2; }
  th.pos, th.name, th.total { z-index: 3; }
  /* subtle divider between the pinned block and the scrolling stages */
  td.total, th.total { border-right: 2px solid var(--line); }

  /* The rank stays right-pinned in its fixed column; its right padding and the
     Driver column's left padding keep a readable gap between the two. */
  td.pos { color: var(--txt); text-align: right; padding-right: 10px; }
  .rankchange { display: inline-block; width: 9px; margin: 0 5px 0 0; font-size: 11px;
                font-weight: 700; line-height: 1; vertical-align: 1px; }
  .rankchange.up { color: var(--ok); }
  .rankchange.down { color: var(--sub); }
  .rankchange.same { color: var(--txt); }
  .stagename { display: block; color: var(--txt); text-transform: none;
               font-weight: 500; font-size: 12px;
               white-space: normal; overflow-wrap: anywhere; }
  .flag { width: 18px; height: 13px; margin-right: 6px; vertical-align: middle;
          border-radius: 2px; object-fit: cover; }
  /* keeps pseudos aligned when a driver has no known flag yet */
  .flag-ph { display: inline-block; width: 18px; height: 13px; margin-right: 6px;
             vertical-align: middle; }
  .car { display: block; font-size: 12px; font-weight: 400; color: var(--dim);
         overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover td { background: var(--panel); }
  td.name { font-weight: 700; }
  td.total { font-weight: 700; }
  .rallypoints .t-diff { display: none; }
  /* second line in a time cell: gap to the column leader, small + dim */
  .t-diff { display: block; font-size: 12px; line-height: 1.1; min-height: 14px;
            font-weight: 400; font-style: normal; color: var(--dim); }
  /* stage time over the cap (real stage time shown) -> grey italic */
  td.pen { color: var(--faint); font-style: italic; }
  td.ignored { color: var(--faint); font-style: italic; }
  /* live cumulative split: visible for comparison, never counted as a finish */
  td.split { color: var(--dim); }
  /* started the stage but never crossed the line -> light grey italic, like a penalized time */
  td.dnf { color: var(--faint); font-style: italic; letter-spacing: .5px; }
  .gold { color: var(--gold); }
  .silver { color: var(--silver); }
  .bronze { color: var(--bronze); }
  td.name.gold, td.name.silver, td.name.bronze { font-weight: 700; }
  footer { padding: 6px 20px 12px; color: var(--dim); font-size: 12px; }
  footer a { color: var(--dim); text-decoration: underline; }
  footer a:hover { color: var(--accent); }
  .empty-state { padding: 40px 20px; color: var(--dim); text-align: center; }

  /* ---- streaming-overlay modes (?view=classification / ?view=progress) --------------
     Transparent window canvas, only the requested widget visible. Used by the
     embedded overlay windows (WebView2) so OBS / on-top capture shows one widget
     on a see-through background. */
  /* OBS overlays always use the dark palette: their translucent card/track
     backgrounds are dark regardless of the viewer page's chosen theme. */
  body.overlay {
    --bg: #0e1116; --panel: #161b22; --line: #263041; --txt: #e6edf3;
    --dim: #8b949e; --accent: #a33a43; --accent-contrast: #fff;
    --sub: #c96a72; --ok: #3fb950; --faint: #d9e0e8;
    --gold: #f2b705; --silver: #94a3b8; --bronze: #e08b43;
    background: transparent; overflow: hidden;
  }
  /* overlays never scroll — content is clipped to the window (resize to reveal) */
  body.overlay .table-scroll { max-height: none; overflow: hidden; }
  body.overlay .table-hscroll { display: none !important; }
  body.overlay header, body.overlay .stagebar, body.overlay footer { display: none !important; }
  body.view-classification .progwrap { display: none !important; }
  body.view-classification .boardbar { display: none !important; }
  body.view-classification .wrap { padding: 0; }
  /* table keeps a solid dark card so the rows read against any background. Only
     #/Driver/Total remain (no horizontal scroll) so sticky pinning is dropped;
     the table stays its NATURAL width — the overlay window fits+zooms to it. */
  /* semi-transparent fill so the game/desktop shows through the classification overlay
     (opacity set per-overlay from the IHM via --ov-alpha) */
  body.view-classification table { background: rgba(14, 17, 22, var(--ov-alpha)); border-radius: 8px; }
  body.view-classification th, body.view-classification td { position: static; }
  /* the header + pinned #/Driver/Total cells paint an opaque var(--bg) for scrolling;
     clear it in the overlay so the table's translucent fill (--ov-alpha) shows through */
  body.view-classification thead th,
  body.view-classification th.pos, body.view-classification td.pos,
  body.view-classification th.name, body.view-classification td.name,
  body.view-classification th.total, body.view-classification td.total { background: transparent; }
  /* the three columns keep a FIXED total width (34 + 178 + 100 = the old 46 + 150 +
     116) so the overlay never resizes with the entry list: # and Total give up the
     slack they never used, Driver gets it and fits longer names before the ellipsis. */
  body.view-classification th.pos, body.view-classification td.pos {
    --w-pos: 34px; padding-left: 2px; padding-right: 6px; }
  body.view-classification th.name, body.view-classification td.name {
    --w-name: 178px; padding-left: 8px; padding-right: 8px; }
  /* 100px minus 14px of padding = 86px of text, and a full-hour "1:02:34.567" at
     bold 15px measures 81px — the widest total the column ever has to hold. */
  body.view-classification th.total, body.view-classification td.total {
    --w-time: 100px; padding-left: 4px; padding-right: 10px; }
  /* general classification only: drop the per-stage columns, keep #/Driver/Total */
  body.view-classification th.cell, body.view-classification td.cell { display: none !important; }
  /* During Racing, replace Total with the column driving the live ranking. */
  body.view-classification.live-board.live-latest-ready th.total,
  body.view-classification.live-board.live-latest-ready td.total { display: none !important; }
  body.view-classification th.cell.live-latest,
  body.view-classification td.cell.live-latest {

<!-- Latest /state payload. The server bakes the current state in here when serving
     the page, and the page re-mirrors every later update, so BOTH "Save page as"
     modes capture it: "HTML only" keeps the served (load-time) state, "Complete"
     keeps the live serialized DOM (save-time state). Reopened offline (file://, no
     server), the page renders from this and the viewer settings stay fully
     functional — they recompute client-side. type=application/json: never runs. -->
<script type="application/json" id="statecache"></script>

<script>
// header logo = the favicon artwork, reused so the data URI lives in the file once
document.getElementById("logo").src = document.querySelector('link[rel="icon"]').href;

// overlay mode: ?view=classification / ?view=progress strips the page down to one widget
// on a transparent canvas (streaming overlay windows load these).
const VIEW = new URLSearchParams(location.search).get("view");
if (location.protocol === "file:") document.body.classList.add("saved-page");
if (VIEW === "classification" || VIEW === "progress") {
  document.body.classList.add("overlay", "view-" + VIEW);
  // per-overlay background opacity: ?bg=<0..100> from the host (may be re-set live
  // via document.documentElement.style setProperty('--ov-alpha', …) from the IHM).
  const bg = new URLSearchParams(location.search).get("bg");
  if (bg !== null && bg !== "") {
    const a = Math.max(0, Math.min(100, parseFloat(bg)));
    if (!isNaN(a)) document.documentElement.style.setProperty("--ov-alpha", a / 100);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// fill an element with text where URLs become clickable anchors. Accepts an
// explicit scheme (http/https), a "www." prefix, or a bare domain (example.com,
// discord.gg/…) — the last two get an https:// href. Builds DOM nodes (no
// innerHTML) so surrounding text is never interpreted as markup.
function setLinkified(el, text) {
  el.textContent = "";
  // 1) http(s)://…   2) www.…   3) bare domain: label(.label)+/optional-path,
  //    TLD ≥2 letters. Case-insensitive.
  const re = /(https?:\/\/[^\s]+|www\.[^\s]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s]*)?)/gi;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    let url = m[0], trail = "";
    // don't swallow trailing punctuation that's clearly sentence-level, not URL
    const cut = url.match(/[.,;:!?)\]]+$/);
    if (cut) { trail = cut[0]; url = url.slice(0, -trail.length); }
    const a = document.createElement("a");
    a.href = /^https?:\/\//i.test(url) ? url : "https://" + url;
    a.textContent = url;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    el.appendChild(a);
    if (trail) el.appendChild(document.createTextNode(trail));
    last = m.index + m[0].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

function fmt(sec) {
  if (sec == null) return "—";
  // round to ms FIRST, then split: toFixed on the seconds remainder can round
  // 59.9996 up to "60.000" without carrying into the minutes
  const ms = Math.round(sec * 1000);
  const m = Math.floor(ms / 60000);
  const s = (ms - m * 60000) / 1000;
  return String(m).padStart(2, "0") + ":" + s.toFixed(3).padStart(6, "0");
}

// gap to the column leader; blank when this cell IS the leader (or no value)
function fmtGap(sec) {
  if (sec == null || sec <= 0.0005) return "";
  const ms = Math.round(sec * 1000);
  const m = Math.floor(ms / 60000);
  const s = (ms - m * 60000) / 1000;
  return "+" + String(m).padStart(2, "0") + ":" + s.toFixed(3).padStart(6, "0");
}

// a time cell: main time on line 1, small gap-to-leader on line 2
function setCell(td, mainText, diffText) {
  td.appendChild(document.createTextNode(mainText));
  const d = document.createElement("span");
  d.className = "t-diff";
  d.textContent = diffText || "";
  td.appendChild(d);
}

function medalClass(n) {
  return n === 1 ? "gold" : n === 2 ? "silver" : n === 3 ? "bronze" : "";
}

  Germany:"de", Ghana:"gh", Greece:"gr", Grenada:"gd", Guatemala:"gt", Guinea:"gn",

  Hungary:"hu", Iceland:"is", India:"in", Indonesia:"id", Iran:"ir", Iraq:"iq",

  Kazakhastan:"kz", Kenya:"ke", Kiribati:"ki", Kuwait:"kw", Kyrgyzstan:"kg", Laos:"la",

  Lichtenstein:"li", Lithuania:"lt", Luxembourg:"lu", Macau:"mo", Madagascar:"mg",

  SaintLucia:"lc", SaintVincentAndGrenadines:"vc", Samoa:"ws", SanMarino:"sm",
  SaoTomeAndPrincipe:"st", SaudiArabia:"sa", Senegal:"sn", Serbia:"rs", Seychelles:"sc",
  SierraLeone:"sl", Singapore:"sg", Slovakia:"sk", Slovenia:"si", SolomonIslands:"sb",
  Somalia:"so", SouthAfrica:"za", SouthKorea:"kr", SouthSudan:"ss", Spain:"es",
  SriLanka:"lk", Sudan:"sd", Suriname:"sr", Sweden:"se", Switzerland:"ch", Syria:"sy",
  TaipeiChina:"tw", Tajikistan:"tj", Tanzania:"tz", Thailand:"th", TimorLeste:"tl",
  Togo:"tg", Tonga:"to", TrinidadAndTobago:"tt", Tunisia:"tn", Turkey:"tr",
  Turkmenistan:"tm", Tuvalu:"tv", Uganda:"ug", Ukraine:"ua", UnitedArabEmirates:"ae",
  UnitedKingdom:"gb", UnitedStates:"us", Uruguay:"uy", Uzbekistan:"uz", Vanuatu:"vu",
  Vatican:"va", Venezuela:"ve", Vietnam:"vn", Wales:"gb-wls", Yemen:"ye", Zambia:"zm",

  // not in the game list but harmless if a future build splits the UK out
  England:"gb-eng", Scotland:"gb-sct", Ireland:"ie"
};

// flagcdn image code (emoji flags don't render on Windows — use images instead)
function flagCode(nat) {
  if (!nat) return null;
  const code = NATION_ISO[nat];
  return code || null;
}

// raw CarId straight from the wire (e.g. "SkodaFabiaRSRally2") — no brand list, no
// space-insertion. The backend already sends the exact token; show it verbatim.
function carLabel(car) {
  return car || "";
}
function carLabels(cars) {
  return [...new Set((cars || []).map(carLabel).filter(Boolean))].join(" · ");
}

// "SS1 AlsaceS4Saverne" -> "SS1" over "AlsaceS4Saverne" (two lines)
function stageHeaderHtml(label) {
  const m = /^(SS\d+)\s+(.+)$/.exec(label);
  if (m) return esc(m[1]) + '<span class="stagename">' + esc(m[2]) + "</span>";
  return esc(label);
}

// distinct marker colors; a driver keeps their color (stable name hash)
const CAR_COLORS = ["#e6194b","#3cb44b","#ffe119","#4363d8","#f58231","#911eb4",
                    "#42d4f4","#f032e6","#bfef45","#fabed4","#469990","#dcbeff",
                    "#9a6324","#fffac8","#800000","#aaffc3"];
function carColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CAR_COLORS[h % CAR_COLORS.length];
}

// live progression track: keyed DOM elements so the markers slide (CSS transition)
const progEls = new Map();   // name -> { dot, lbl }
function renderProgress(list, windowKm, fixed) {
  const wrap = document.getElementById("progwrap");
  const track = document.getElementById("progtrack");
  list = list || [];
  // the bar is ALWAYS shown now (even with no data): an empty track with its axis
  // labels, so the overlay/page keeps a stable footprint before anyone is driving.
  wrap.style.display = "";
  // fixed (default): the window always spans windowKm, right edge on the leader —
  // a stable scale. auto-fit: the range STRETCHES in real time between the leader
  // (right edge) and the last car (left edge), windowKm being the MAX span (a
  // cap). In both modes cars further back than the window are hidden. Finished
  // cars DO define the edges — once the fastest crosses the line the right edge
  // pins to the stage end and stops moving.
  // Excluded from the edges: DNF/retired cars (frozen mid-track) and cars still on
  // the start line (dist ~0 — a mid-stage joiner / not-yet-launched car that would
  // otherwise peg the tail at 0 and the span at the cap for the whole stage).
  const CAP = Math.max(100, (windowKm || 2) * 1000);
  const setLo = s => document.querySelector(".proglo").textContent =
    "−" + (s >= 1000 ? (s / 1000).toFixed(s % 1000 ? 1 : 0) + " km" : Math.round(s) + " m");
  if (list.length === 0) {
    for (const e of progEls.values()) { e.dot.remove(); e.lbl.remove(); }
    progEls.clear();
    setLo(CAP);
    document.getElementById("progkm").textContent = "0.00 km";
    return;
  }
  // edges over cars that have actually STARTED and are not DNF. A car still on the
  // start line (dist ~0: a mid-stage joiner, a spectator, someone not yet launched)
  // would otherwise pin the tail to 0 and peg the span at the cap for the whole
  // stage; a DNF is frozen mid-track. Neither may define the leader/tail.
  const edge = list.filter(p => !p.out && p.dist > 1);
  const fit = edge.length ? edge : list;        // pre-start (all at the line) fallback
  const maxd = Math.max(...fit.map(p => p.dist));
  const mind = Math.min(...fit.map(p => p.dist));
  // fixed (default): the span IS the configured range, leader right-pinned — the
  // scale never moves. Auto-fit: the span fits the field [tail, leader] but never
  // exceeds the configured cap, with a 100 m floor so a bunched grid (everyone
  // near 0) doesn't collapse to /0.
  const span = fixed ? CAP : Math.min(Math.max(maxd - mind, 100), CAP);
  const left = maxd - span;
  setLo(span);
  document.getElementById("progkm").textContent = (maxd / 1000).toFixed(2) + " km";
  const W = track.clientWidth;
  const seen = new Set();
  const rows = { t1: [], b1: [], t2: [], b2: [] };   // label rows, for de-overlap
  const ROW = ["t1", "b1", "t2", "b2"];
  // the span caption ("−2 km") owns the bottom-left corner and shares its band with
  // the b1 row only. A label that would land on it is moved UP to b2 rather than
  // pushed right: the name stays centred on its marker, which is what identifies it.
  const lo = document.querySelector(".proglo");
  const loFloor = lo.offsetLeft + lo.offsetWidth + 6;
  list.forEach((p, i) => {
    seen.add(p.name);
    let e = progEls.get(p.name);
    if (!e) {
      e = { dot: document.createElement("span"), lbl: document.createElement("span") };
      track.appendChild(e.dot); track.appendChild(e.lbl);
      progEls.set(p.name, e);
    }
    const rel = (p.dist - left) / span;              // 1 = leader edge, 0 = tail edge
    // cars further back than the window are hidden entirely (not clamped left)
    if (rel < 0) { e.dot.style.display = "none"; e.lbl.style.display = "none"; e.lbl.textContent = ""; return; }
    e.dot.style.display = "";
    const x = W * (0.03 + 0.94 * Math.min(1, rel));
    e.dot.className = "progcar" + (p.finished ? " fin" : "") + (p.out ? " out" : "")
                    + (p.named ? "" : " anon");
    // named cars keep a stable per-driver colour; an unnamed car is a neutral dot
    e.dot.style.background = p.named ? carColor(p.name) : "var(--dim)";
    e.dot.style.left = x.toFixed(1) + "px";
    const gap = Math.round(maxd - p.dist);
    const t = (p.named ? p.name : "Unknown car") + " — " + (p.dist / 1000).toFixed(2) + " km" +
              (gap > 0 ? " (−" + gap + " m)" : "") +
              (p.out ? " (out)" : p.finished ? " (finished)" : "");
    e.dot.title = t;
    // only IDENTIFIED cars get a text label (no "Car N" placeholders); the dot
    // alone conveys an unknown car's position. Labels rotate over 4 rows (the list
    // is distance-sorted, so neighbours land on different rows) then de-overlap.
    if (p.named) {
      let row = ROW[i % 4];
      e.lbl.className = "proglbl " + row;
      const short = p.name.length > 14 ? p.name.slice(0, 13) + "…" : p.name;
      e.lbl.textContent = short + (p.out ? " ✕" : p.finished ? " ✓" : "");
      // measured with the text in place: a bottom-row label that would sit over the
      // span caption goes up one row instead of being nudged off its marker
      if (row === "b1" && x - e.lbl.offsetWidth / 2 < loFloor) {
        row = "b2";
        e.lbl.className = "proglbl " + row;
      }
      e.lbl.title = t;
      e.lbl.style.display = "";
      rows[row].push({ lbl: e.lbl, x });
    } else {
      e.lbl.style.display = "none";
      e.lbl.textContent = "";
    }
  });
  for (const [name, e] of progEls)
    if (!seen.has(name)) { e.dot.remove(); e.lbl.remove(); progEls.delete(name); }
  // per row: keep labels centred on their marker but push colliding ones apart
  // (finish pile-ups put several markers on the same pixel)
  for (const row of ROW) {
    const items = rows[row].sort((a, b) => a.x - b.x);
    for (let i = 0; i < items.length; i++) {
      const half = items[i].lbl.offsetWidth / 2 || 30;
      items[i].min = items[i].x - half;       // left edge if centred on the marker
      items[i].w = half * 2;
    }
    for (let i = 1; i < items.length; i++)   // forward: no overlap with the left
      items[i].min = Math.max(items[i].min, items[i - 1].min + items[i - 1].w + 6);
    if (items.length) {                       // backward: keep inside the track
      const last = items.length - 1;
      items[last].min = Math.min(items[last].min, W - items[last].w - 4);
      for (let i = last - 1; i >= 0; i--)
        items[i].min = Math.min(items[i].min, items[i + 1].min - items[i].w - 6);
    }
    for (const it of items)
      it.lbl.style.left = (Math.max(2, it.min) + it.w / 2).toFixed(1) + "px";
  }
}

// ---- viewer overrides (session memory; null on a field = follow the host) --------
// The host publishes its config in /state; a viewer may locally diverge on any of
// these. Only stage-exclusion / penalty% / hide-splits change the standings and
// trigger a client-side recompute from the ungated `rawCells`; hide-nations and the
// progression window are purely presentational. Nothing is persisted — a reload
// (or Reset) drops back to the host's published config.
const ov = { discarded: null, pct: null, dnfNoRejoin: null, hideSplits: null, hideNations: null, theme: null, progKm: null,
             progFixed: null, groupFilter: null };
let lastServer = null;
let lastRendered = null;
let lastHostHideSplits = null;
let lastHostDnfNoRejoin = null;
let sortKey = "total";  // total by default; stage keys are stable stage ids
let standingsSortKey = "total"; // points are naturally sorted from highest to lowest
let activeTab = "stages";
let groupSelection = new Set();
const seenStageIds = new Set();

const hasOverride = () =>
  ov.discarded !== null || ov.pct !== null || ov.dnfNoRejoin !== null || ov.hideSplits !== null ||
  ov.hideNations !== null || ov.theme !== null || ov.progKm !== null ||
  ov.progFixed !== null || ov.groupFilter !== null;

const hostDiscarded = v => new Set((v.allStages || []).filter(s => s.discarded).map(s => s.id));
const effDiscarded  = v => ov.discarded !== null ? ov.discarded : hostDiscarded(v);
const hostGroups = v => new Map((v.allStages || []).filter(s => s.group > 0).map(s => [s.id, s.group]));
const effGroups = hostGroups;  // rally definitions always come from the host
const progKmOf      = v => ov.progKm !== null ? ov.progKm : v.progressWindowKm;
// `!== false` so a cached payload from a host without the field defaults to fixed
const progFixedOf   = v => ov.progFixed !== null ? ov.progFixed : v.progressFixed !== false;
const hideSplitsOn  = v => ov.hideSplits !== null ? ov.hideSplits : !!v.hideSplits;
const dnfNoRejoinOn = v => ov.dnfNoRejoin !== null ? ov.dnfNoRejoin : !!v.dnfNoRejoin;
const hideNatOn     = () => ov.hideNations === true;
function applyTheme(theme) {
  // Remove the attribute entirely for "system": an EMPTY data-theme still counts
  // as present for [data-theme] selectors, which would defeat the
  // `body:not([data-theme])` prefers-color-scheme rules.
  if (theme === "light" || theme === "dark") document.body.dataset.theme = theme;
  else delete document.body.dataset.theme;
}
const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
const themeButton = document.getElementById("themebtn");
function resolvedTheme() {
  return ov.theme || (systemTheme.matches ? "dark" : "light");
}
function syncThemeButton() {
  const current = resolvedTheme();
  const next = current === "dark" ? "light" : "dark";
  themeButton.textContent = current === "dark" ? "☾" : "☀";
  themeButton.title = `Switch to ${next} theme`;
  themeButton.setAttribute("aria-label", `Switch to ${next} theme`);
  themeButton.classList.toggle("on", ov.theme !== null);
}
themeButton.addEventListener("click", () => {
  ov.theme = resolvedTheme() === "dark" ? "light" : "dark";
  applyTheme(ov.theme);
  syncThemeButton();
  if (lastServer) syncPanel(lastServer);
});
systemTheme.addEventListener("change", () => { if (ov.theme === null) syncThemeButton(); });

// THE board computation — the single implementation. The host ships data, never a
// rendered classification: reveal gating, penalty substitution, totals, ranking and
// sort all happen here, from the ungated per-column `rawCells` (t=time, f=matched a
// real finish peak, s=sectors), parameterised by cfg (excluded stage ids, penalty
// fraction, hide-splits policy). A viewer override is just a different cfg.
function computeView(v, cfg, withPositionChange = true) {
  const all = v.allStages || [];
  const N = all.length;
  const currentCol = N > 0 ? all[N - 1].id : null;
  const src = v.rows || [];

  const incl = [];
  for (let c = 0; c < N; c++) if (!cfg.discarded.has(all[c].id)) incl.push(c);

  const maxSec = {}, confirmed = {}, slowest = {};
  for (const c of incl) {
    let ms = 0, conf = false;
    for (const r of src) {
      const rc = r.rawCells && r.rawCells[c];
      if (!rc) continue;
      if (rc.s > ms) ms = rc.s;
      if (v.hasRaceState && rc.f) conf = true;
    }
    maxSec[c] = ms; confirmed[c] = conf;
  }
  // Completion is independent from display mode: a split must NEVER enter the
  // aggregate total. With RaceState, the per-car finish event is the primary proof
  // of a line crossing. Fallback for a LOST finish peak (passive sniffer — drops
  // happen): sector count at the field max, a peer's confirmed finish, AND the host
  // not having flagged the car as a non-finisher (rc.r covers retire/disqualify and
  // vanished actors — exactly the cars whose last split would otherwise read as a
  // final). Without RaceState, a complete sector chain is the only proxy.
  const completed = (rc, c) => rc != null && rc.t != null && (v.hasRaceState
    ? (rc.f || (confirmed[c] && rc.s === maxSec[c] && rc.s > 0 && !rc.r))
    : rc.s === maxSec[c]);
  // With gating off, show one comparable split level at a time: the furthest sector
  // the field has reached. As soon as S2/S3/finish appears, older levels disappear.
  const revealed = (rc, c) => rc != null &&
    (cfg.hideSplits ? completed(rc, c) : rc.s === maxSec[c]);
  for (const c of incl) {
    let worst = -Infinity;
    for (const r of src) {
      const rc = r.rawCells && r.rawCells[c];
      if (completed(rc, c) && rc.t > worst) worst = rc.t;
    }
    if (worst > -Infinity) slowest[c] = worst;
  }

  const rows = src.map(r => {
    const cells = [];
    let total = 0, totalSubstituted = false;
    let firstDnf = -1, completedBeforeDnf = 0, timeBeforeDnf = 0;
    const participated = incl.some(c => r.rawCells && r.rawCells[c] != null);
    for (const c of incl) {
      const rc = r.rawCells ? r.rawCells[c] : null;
      const has = rc != null;
      const final = has && completed(rc, c);
      const real = (has && revealed(rc, c)) ? rc.t : null;
      const finalTime = final ? rc.t : null;
      // A driver abandoned a stage they posted splits on: the host's direct per-cell
      // flag (rc.r — retire/disqualify or vanished actor, live or snapshot at column
      // close) is authoritative; the peer-finished inference remains as fallback for
      // closed columns where no car-state signal was captured at all.
      const settled = all[c].id !== currentCol || v.phase === "Results";
      const dnf = !final && (
        (has && (!!rc.r || (v.hasRaceState &&
          (all[c].id !== currentCol ? confirmed[c] : !!r.retired)))) ||
        // Under No Rejoin, missing a settled stage is also the first failure to
        // finish. `participated` prevents drivers with no start in this rally from
        // being promoted from DNS to DNF merely because other drivers finished.
        (cfg.dnfNoRejoin && participated && settled));
      if (cfg.dnfNoRejoin && firstDnf < 0 && dnf) firstDnf = cells.length;
      const counted = !cfg.dnfNoRejoin || firstDnf < 0;
      if (!(c in slowest)) {
        cells.push({ real, effective: finalTime == null ? 0 : finalTime,
                     substituted: false, empty: true, dnf, final, counted });
        if (counted && finalTime != null) total += finalTime;
        if (firstDnf < 0 && finalTime != null) {
          completedBeforeDnf++; timeBeforeDnf += finalTime;
        }
        continue;
      }
      const threshold = slowest[c] * (1 + cfg.pct);
      let effective, substituted;
      // No Rejoin is a complete alternative to penalty-cap scoring: completed
      // stages keep their real time, an unsettled absence adds nothing, and once
      // settled that absence makes the driver DNF with no general total.
      if (cfg.dnfNoRejoin) { effective = finalTime == null ? 0 : finalTime; substituted = false; }
      else if (finalTime == null) { effective = threshold; substituted = true; }
      else if (finalTime > threshold) { effective = threshold; substituted = true; }
      else { effective = finalTime; substituted = false; }
      if (counted) {
        total += effective;
        if (substituted) totalSubstituted = true;
      }
      if (firstDnf < 0 && finalTime != null) {
        completedBeforeDnf++; timeBeforeDnf += finalTime;
      }
      cells.push({ real, effective, substituted, empty: false, dnf, final, counted });
    }
    // `timed` = has at least one completed stage time, so it is classified. Computed
    // once here: the sort comparator would otherwise rescan every cell per comparison.
    // Keep only cars from stages where this driver posted a split/result, then
    // de-duplicate the selected stages' list. A viewer changing their stage
    // selection therefore sees exactly the cars used in that selection.
    const cars = [...new Set(incl.map(c => r.rawCells && r.rawCells[c] &&
      ((r.carNames && r.carNames[c]) || (r.cars && r.cars[c]))).filter(Boolean))];
    const timed = cells.some(c => c.final);
    const status = cfg.dnfNoRejoin
      ? (firstDnf >= 0 ? "dnf" : incl.length === 0 ? "pending"
        : !participated ? "dns" : timed ? "finisher" : "pending")
      : (timed ? "classified" : "unclassified");
    return { driver: r.driver, cells, total, totalSubstituted, timed,
             classified: cfg.dnfNoRejoin ? status === "finisher" || status === "dnf" : timed,
             pointEligible: cfg.dnfNoRejoin ? status === "finisher" || status === "dnf" : timed,
             status, completedBeforeDnf, timeBeforeDnf, nation: r.nation, cars };
  });

  // Legacy mode keeps the capped-total order. No Rejoin puts every finisher before
  // DNF, then orders DNF by stages completed before the first abandon and by the
  // real cumulative time on those stages. The name only stabilises display order;
  // it is deliberately excluded from the DNF rank-equivalence rule below.
  rows.sort((a, b) => {
    if (cfg.dnfNoRejoin) {
      const category = row => row.status === "finisher" ? 0 : row.status === "dnf" ? 1
        : row.status === "pending" ? 2 : 3;
      const categoryDiff = category(a) - category(b);
      if (categoryDiff) return categoryDiff;
      if (a.status === "dnf") {
        const dnfDiff = (b.completedBeforeDnf - a.completedBeforeDnf) ||
          (a.timeBeforeDnf - b.timeBeforeDnf);
        if (dnfDiff) return dnfDiff;
      } else if (a.status === "finisher") {
        const finishedDiff = b.cells.filter(c => c.final).length - a.cells.filter(c => c.final).length;
        const finisherDiff = (a.total - b.total) || finishedDiff;
        if (finisherDiff) return finisherDiff;
      }
      return a.driver < b.driver ? -1 : a.driver > b.driver ? 1 : 0;
    }
    if (a.timed !== b.timed) return a.timed ? -1 : 1;
    const finishedDiff = b.cells.filter(c => c.final).length - a.cells.filter(c => c.final).length;
    return (a.total - b.total) || finishedDiff ||
      (a.driver < b.driver ? -1 : a.driver > b.driver ? 1 : 0);
  });
  rows.forEach((r, i) => {
    const previous = i > 0 ? rows[i - 1] : null;
    const tiedDnf = cfg.dnfNoRejoin && previous && r.status === "dnf" && previous.status === "dnf" &&
      r.completedBeforeDnf === previous.completedBeforeDnf && r.timeBeforeDnf === previous.timeBeforeDnf;
    const tiedDns = cfg.dnfNoRejoin && previous && r.status === "dns" && previous.status === "dns";
    r.rank = tiedDnf || tiedDns ? previous.rank : i + 1;
  });

  // General-classification movement since the previous selected stage. Re-run the
  // exact same scoring rules without the newest selected column, so caps, DNF and
  // viewer overrides remain consistent with the displayed ranking. A driver who was
  // not classified yet has no prior rank and therefore no misleading arrow.
  if (withPositionChange && incl.length > 1) {
    const priorDiscarded = new Set(cfg.discarded);
    priorDiscarded.add(all[incl[incl.length - 1]].id);
    const priorRows = computeView(v, Object.assign({}, cfg, { discarded: priorDiscarded }), false).rows;
    const priorRanks = new Map(priorRows.filter(r => r.classified).map(r => [r.driver, r.rank]));
    rows.forEach(r => r.rankChange = r.classified && priorRanks.has(r.driver)
      ? priorRanks.get(r.driver) - r.rank : null);
  } else {
    rows.forEach(r => r.rankChange = null);
  }

  return Object.assign({}, v, {
    stages: incl.map(c => ({ id: all[c].id, name: all[c].name, group: cfg.groups.get(all[c].id) || 0 })),
    rows, pct: cfg.pct, dnfNoRejoin: !!cfg.dnfNoRejoin
  });
}

// the view actually rendered: always computed here, using the host's published
// config unless the viewer has overridden a board-affecting field.
function effectiveView(v) {
  return computeView(v, {
    discarded: effDiscarded(v),
    groups: effGroups(v),
    pct: ov.pct !== null ? ov.pct : (v.pct || 0),
    dnfNoRejoin: dnfNoRejoinOn(v),
    hideSplits: hideSplitsOn(v)
  });
}

// The standings board deliberately ignores the viewer's stage checkboxes: it always
// ranks every configured rally from all of the stages assigned to that rally.
function standingsView(v) {
  const groups = effGroups(v);
  const discarded = new Set((v.allStages || [])
    .filter(s => !(groups.get(s.id) > 0)).map(s => s.id));
  return computeView(v, {
    discarded, groups,
    pct: ov.pct !== null ? ov.pct : (v.pct || 0),
    dnfNoRejoin: dnfNoRejoinOn(v),
    hideSplits: hideSplitsOn(v)
  });
}
function displayedView(v) { return activeTab === "standings" ? standingsView(v) : effectiveView(v); }

// Host-assigned group names travel with their stages.
function rallyName(all, groups, group) {
  const named = all.find(s => groups.get(s.id) === group && s.group === group && s.groupName);
  return named ? named.groupName : "Rally " + group;
}

// ---- settings panel: build/sync from the latest host payload + current overrides --
const cfgEls = {};
let stageIdsKey = "";
let scrollLayoutFrame = 0;
function syncScrollLayout() {
  scrollLayoutFrame = 0;
  if (document.body.classList.contains("overlay")) return;
  const page = document.getElementById("pageContent");
  const board = document.querySelector(".boardbar");
  const tableScroll = document.querySelector(".table-scroll");
  const table = document.getElementById("tbl");
  const hscroll = document.getElementById("tableHScroll");
  const hscrollInner = document.getElementById("tableHScrollInner");
  const wrap = document.getElementById("wrap");
  const footer = document.querySelector("footer");
  if (!page || !board || !tableScroll || !table || !hscroll || !hscrollInner || !wrap || !footer) return;
  document.body.style.setProperty("--footer-height", footer.offsetHeight + "px");
  // When the page chrome has scrolled away, the board bar and this viewport fill
  // the page pane exactly. That leaves the footer outside the scrolling area.
  const baseHeight = page.clientHeight - board.offsetHeight;
  const overflows = table.style.display !== "none" && table.scrollWidth > tableScroll.clientWidth + 1;
  hscroll.hidden = !overflows;
  tableScroll.style.setProperty("--table-viewport-height", Math.max(120, baseHeight) + "px");
  if (!overflows) { tableScroll.scrollLeft = 0; return; }
  // Match the table's scroll range even when its vertical rail makes it a few
  // pixels narrower than this separate horizontal rail.
  hscrollInner.style.width = Math.max(hscroll.clientWidth,
    table.scrollWidth + hscroll.clientWidth - tableScroll.clientWidth) + "px";
  if (Math.abs(hscroll.scrollLeft - tableScroll.scrollLeft) > 1)
    hscroll.scrollLeft = tableScroll.scrollLeft;
}
function scheduleScrollLayout() {
  if (!scrollLayoutFrame) scrollLayoutFrame = requestAnimationFrame(syncScrollLayout);
}
function initScrollLayout() {
  const page = document.getElementById("pageContent");
  const tableScroll = document.querySelector(".table-scroll");
  const hscroll = document.getElementById("tableHScroll");
  if (!page || !tableScroll || !hscroll) return;
  const scrollPageBeforeTable = deltaY => {
    const pageMax = page.scrollHeight - page.clientHeight;
    if (deltaY > 0 && page.scrollTop < pageMax - 1) {
      page.scrollTop = Math.min(pageMax, page.scrollTop + deltaY);
      return true;
    }
    if (deltaY < 0 && tableScroll.scrollTop <= 0 && page.scrollTop > 0) {
      page.scrollTop = Math.max(0, page.scrollTop + deltaY);
      return true;
    }
    return false;
  };
  // Wheel the page chrome out of view before moving table rows. Reversing at the
  // first row brings the page chrome back, so the interaction is one continuous
  // vertical journey even though the table owns its horizontal scrollbar.
  tableScroll.addEventListener("wheel", event => {
    if (event.ctrlKey || event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    if (scrollPageBeforeTable(event.deltaY)) event.preventDefault();
  }, { passive: false });
  // Touch input does not emit wheel events. Route vertical swipes in the table
  // through the same hand-off, so a phone user can reveal the page chrome from
  // any table row instead of having to start the gesture in the header.
  let touch = null;
  tableScroll.addEventListener("touchstart", event => {
    const point = event.touches[0];
    touch = point ? { x: point.clientX, y: point.clientY } : null;
  }, { passive: true });
  tableScroll.addEventListener("touchmove", event => {
    const point = event.touches[0];

        grouped.get(group).push(s);

  // immediately here as well as in the streaming overlays. The viewer can still
  // choose a different value afterwards from this page's settings panel.

    ov.hideSplits = null;

  if (lastHostDnfNoRejoin !== null && hostDnfNoRejoin !== lastHostDnfNoRejoin)
    ov.dnfNoRejoin = null;

      String(now.getDate()).padStart(2, "0");

// While a stage is running (Racing through Spectating) the stage history is
// replaced by a checkpoint board for the current run: cumulative sectors appear
// as they are observed and the final column is always the complete stage time. Totals still come from computeView, so
// live splits can never leak into the rally aggregate.
function buildLiveSplitBoard(v) {
  const source = lastServer || v;
  const all = source.allStages || [];
  const currentIndex = all.length - 1;
  const currentId = currentIndex >= 0 ? all[currentIndex].id : null;
  const computedIndex = (v.stages || []).findIndex(stage => stage.id === currentId);
  const rawByDriver = new Map((source.rows || []).map(row => [row.driver, row]));
  // Progress markers already carry each named car's race phase, ahead of the
  // exact-time finish confirmation the cells wait for.
  const finishedMarkers = new Set((source.progress || [])
    .filter(car => car.named && car.finished).map(car => car.name));
  let furthestSector = 0, finishSectors = 0;

  const rows = (v.rows || []).map(row => {
    const sourceRow = rawByDriver.get(row.driver);
    const raw = sourceRow && sourceRow.rawCells && currentIndex >= 0
      ? sourceRow.rawCells[currentIndex] : null;
    const computed = computedIndex >= 0 && row.cells ? row.cells[computedIndex] : null;
    // Only use computeView's lost-peak fallback when RaceState is present. Without
    // that stream, its historical max-sector heuristic cannot distinguish the live
    // field's newest split from the actual finish while the stage is still running.
    const final = !!(raw && (raw.f || (source.hasRaceState && computed && computed.final)));
    const splitCount = raw ? Math.max(raw.s || 0, Array.isArray(raw.splits) ? raw.splits.length : 0) : 0;
    // A finished car's chain already ends with its stage time: while the
    // exact-time match is still pending, keep that value out of the sector
    // columns instead of opening a phantom "Sector N+1" for it.
    const pendingFinish = !final && finishedMarkers.has(row.driver) && splitCount > 0;
    furthestSector = Math.max(furthestSector, pendingFinish ? splitCount - 1 : splitCount);
    if (final) finishSectors = Math.max(finishSectors, splitCount);
    return { ...row, liveRaw: raw, liveComputed: computed, liveFinal: final };
  });

  // Once a finish establishes the full chain, its last record belongs in "Stage";
  // until then every newly observed record is another cumulative sector split.
  const sectorCount = finishSectors > 0 ? Math.max(0, finishSectors - 1) : furthestSector;
  const columns = Array.from({ length: sectorCount }, (_, splitIndex) => ({
    name: "Sector " + (splitIndex + 1), splitIndex, finish: false
  }));
  columns.push({ name: "Stage", splitIndex: null, finish: true });

  rows.forEach(row => {
    const raw = row.liveRaw;
    const splits = raw && Array.isArray(raw.splits) ? raw.splits.slice() : [];
    // Compatibility with cached pages/older hosts that only publish the latest
    // cumulative value: place it at its known sector, without inventing earlier ones.
    if (raw && splits.length === 0 && !row.liveFinal && raw.t != null && raw.s > 0)

      if (!column.finish) {

    : sectorCount > 0 ? sectorCount - 1 : -1;

    if (latestIndex < 0) return a.rank - b.rank;
    const av = a.liveValues[latestIndex].time, bv = b.liveValues[latestIndex].time;

    const ranksAt = columnIndex => new Map(rows

        || (a.rank - b.rank))
      .map((row, index) => [row.driver, index + 1]));

    const currentRanks = ranksAt(latestIndex);
    rows.forEach(row => {

      const av = sortValue(a), bv = sortValue(b);
      if (av == null || bv == null) return av == null ? (bv == null ? a.rank - b.rank : 1) : -1;

  const stageMedal = stageCols.map(({ cellIndex, medals }) => {
    if (live) return medals;
    const m = new Map();
    rows.map(r => ({ d: r.driver, c: r.cells ? r.cells[cellIndex] : null }))
        // finish times only — an intermediate split never takes a podium slot
        .filter(x => x.c && x.c.final && !x.c.substituted && x.c.real != null)
        .sort((a, b) => a.c.real - b.c.real)

  // per stage column: fastest real time (reference for the small gap line)
  const stageFastest = stageCols.map(({ cellIndex, fastest }) => {
    if (live) return fastest;
    let best = Infinity;
    rows.forEach(r => {
      const c = r.cells && r.cells[cellIndex];

  rows.forEach(r => {

    const tdName = document.createElement("td");
    tdName.className = "name" + (nmc ? " " + nmc : "");
    const fc = hideNatOn() ? null : flagCode(r.nation);

      img.className = "flag";
      img.src = "https://flagcdn.com/20x15/" + fc + ".png";
      img.srcset = "https://flagcdn.com/40x30/" + fc + ".png 2x";

      img.onerror = () => { const ph = document.createElement("span");
                            ph.className = "flag-ph"; img.replaceWith(ph); };
      tdName.appendChild(img);
    } else {
      // no known flag: reserve the same space so pseudos stay aligned
      const ph = document.createElement("span");
      ph.className = "flag-ph";
      tdName.appendChild(ph);
    }
    tdName.appendChild(document.createTextNode(r.driver));
    const car = carLabels(r.cars);
    if (car) {
      const c = document.createElement("span");
      c.className = "car"; c.textContent = car; tdName.appendChild(c);
    }
    tdName.title = r.driver + (car ? " — " + car : "");
    tr.appendChild(tdName);

    const tdTot = document.createElement("td");
    // The overall classification always shows the CAPPED ranking total. Real times
    // in grey italic belong to individual stage cells only. Keep the aggregate blank
    // until the driver has at least one completed stage time; after that, absent/DNF
    // stages contribute their configured cap exactly as they do to the sort.
    tdTot.className = "total" + (nmc ? " " + nmc : "");
    if (v.dnfNoRejoin && r.status === "dnf") {
      setCell(tdTot, "DNF", "");
      tdTot.title = "Did not finish — no general-classification total";
    } else if (v.dnfNoRejoin && r.status === "dns") {
      setCell(tdTot, "DNS", "");
      tdTot.title = "Did not start any selected stage";
    } else if (!r.timed) {
      setCell(tdTot, "", "");
      tdTot.title = "No stage time yet";

      const cell = live ? r.liveValues[cellIndex] : r.cells && r.cells[cellIndex];
      const td = document.createElement("td");
      td.classList.add("cell");
      if (live && latest) td.classList.add("live-latest");
      const fastest = stageFastest[s];
      const value = live ? cell.time : cell.real;
      const gap = (value != null && fastest != null) ? fmtGap(value - fastest) : "";
      if (cell.dnf) {
        // started the stage (posted splits) but never crossed the line
        td.classList.add("dnf");
        setCell(td, "DNF", "");
        td.title = v.dnfNoRejoin

          : "Did not finish — counted as penalty in total";

        setCell(td, cell.real != null ? fmt(cell.real) : "", gap);
        td.title = cell.real != null
          ? "Stage time after DNF — not counted in the general classification"
          : "After DNF — not counted in the general classification";
        const mc = medalClass(stageMedal[s].get(r.driver));
        if (mc) td.classList.add(mc);
      } else if (live && cell.time != null) {
        if (cell.substituted) td.classList.add("pen");
        setCell(td, fmt(cell.time), gap);
        td.title = cell.split ? "Cumulative sector split" :
          cell.substituted ? "Stage time over the penalty cap" : "Stage time";
        const mc = medalClass(stageMedal[s].get(r.driver));
        if (mc) td.classList.add(mc);
      } else if (live) {
        setCell(td, "", "");
      } else if (cell.real != null && !cell.final) {
        // Latest cumulative split at the field's current sector level. Display-only:
        // it is never used as a stage finish or added to the aggregate total.
        td.classList.add("split");
        setCell(td, fmt(cell.real), gap);
        td.title = "Cumulative split time — not counted in total";
      } else if (cell.empty || cell.substituted) {
        // penalized in the total: real time (or blank if none), grey italic
        td.classList.add("pen");
        setCell(td, cell.real != null ? fmt(cell.real) : "", gap);
        td.title = cell.real != null
          ? "Real time " + fmt(cell.real) + " — over penalty cap, counted as penalty in total"
          : "No time — counted as penalty in total";
      } else {
        setCell(td, fmt(cell.effective), gap);
        const mc = medalClass(stageMedal[s].get(r.driver));  // top 3 of this stage
        if (mc) td.classList.add(mc);
      }
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
  scheduleScrollLayout();
}

    const standing = computeView(source, {

      img.onerror = () => { const ph = document.createElement("span"); ph.className = "flag-ph"; img.replaceWith(ph); };
      tdName.appendChild(img);
    } else {
      const ph = document.createElement("span"); ph.className = "flag-ph"; tdName.appendChild(ph);
    }

    if (car) { const c = document.createElement("span"); c.className = "car"; c.textContent = car; tdName.appendChild(c); }
    tdName.title = r.driver + (car ? " — " + car : "");

function tableText(data) {

  const includeSecondary = activeTab !== "stages";

    const pageTitle = document.getElementById("pagetitle").textContent.trim();
    const now = new Date();
    const date = String(now.getFullYear()) + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
    ctx.fillText((pageTitle || "ACR Live Timing") + " · " + pngExportScope() + " · " + date,
      paddingX, paddingTop + 16);
  }

  const top = paddingTop + titleHeight;
  ctx.fillStyle = palette.bg; ctx.fillRect(paddingX, top, width - paddingX * 2, headerHeight);
  let x = paddingX;
  headerLayout.cells.forEach((cell, i) => {
    const cellWidth = widths[i];
    ctx.fillStyle = palette.dim; ctx.font = "600 12px system-ui, Segoe UI, Roboto, sans-serif";
    if (cell.stage) {
      ctx.textAlign = "right";
      const textX = x + cellWidth - 12;
      ctx.fillText(cell.stage[1], textX, top + headerLayout.paddingY + 11);
      ctx.fillStyle = palette.txt; ctx.font = "500 12px system-ui, Segoe UI, Roboto, sans-serif";
      cell.lines.forEach((line, lineIndex) =>
        ctx.fillText(line, textX, top + headerLayout.paddingY + headerLayout.stageLineHeight + 11 + lineIndex * headerLayout.nameLineHeight));
    } else if (cell.rally) {
      ctx.textAlign = "right";
      const textX = x + cellWidth - 12;
      ctx.fillStyle = palette.txt; ctx.font = "500 12px system-ui, Segoe UI, Roboto, sans-serif";
      cell.lines.forEach((line, lineIndex) =>
        ctx.fillText(line, textX, top + headerLayout.paddingY + 11 + lineIndex * headerLayout.nameLineHeight));
    } else {
      ctx.textAlign = i === 1 ? "left" : i === 0 ? "center" : "right";
      const textX = i === 1 ? x + 12 : i === 0 ? x + cellWidth / 2 : x + cellWidth - 12;
      ctx.fillText(fitCanvasText(ctx, cell.header.toUpperCase(), cellWidth - 24), textX, top + (headerHeight + 12) / 2);
    }
    x += cellWidth;
  });
  ctx.strokeStyle = palette.line; ctx.beginPath(); ctx.moveTo(paddingX, top + headerHeight + .5);
  ctx.lineTo(width - paddingX, top + headerHeight + .5); ctx.stroke();

  data.rows.forEach((row, rowIndex) => {
    const y = top + headerHeight + rowIndex * rowHeight;
    let cellX = paddingX;
    row.forEach((cell, colIndex) => {
      const cellWidth = widths[colIndex];
      ctx.fillStyle = exportColor(cell.medal, palette);
      if (colIndex === 1) {
        const flag = flags.get(cell.flag);
        let textX = cellX + 12;
        if (flag) { ctx.drawImage(flag, cellX + 12, y + 10, 18, 13); textX += 24; }
        ctx.textAlign = "left"; ctx.font = "700 15px system-ui, Segoe UI, Roboto, sans-serif";
        const primaryY = cell.secondary ? y + 22 : y + 30;
        ctx.fillText(fitCanvasText(ctx, cell.primary, cellWidth - (textX - cellX) - 10), textX, primaryY);
        if (cell.secondary) {
          ctx.fillStyle = palette.dim; ctx.font = "12px system-ui, Segoe UI, Roboto, sans-serif";
          ctx.fillText(fitCanvasText(ctx, cell.secondary, cellWidth - (textX - cellX) - 10), textX, y + 40);
        }
      } else {
        ctx.textAlign = colIndex === 0 ? "center" : "right";
        const textX = colIndex === 0 ? cellX + cellWidth / 2 : cellX + cellWidth - 12;
        ctx.font = "15px system-ui, Segoe UI, Roboto, sans-serif";
        const primaryY = cell.secondary ? y + 18 : y + 30;
        ctx.fillText(fitCanvasText(ctx, cell.primary, cellWidth - 20), textX, primaryY);
        if (cell.secondary) {
          ctx.fillStyle = palette.dim; ctx.font = "12px system-ui, Segoe UI, Roboto, sans-serif";
          ctx.fillText(fitCanvasText(ctx, cell.secondary, cellWidth - 20), textX, y + 37);
        }
      }
      cellX += cellWidth;
    });
    ctx.strokeStyle = palette.line; ctx.beginPath(); ctx.moveTo(paddingX, y + rowHeight + .5);
    ctx.lineTo(width - paddingX, y + rowHeight + .5); ctx.stroke();
  });
  return canvas;
}
function exportFilename(extension) {
  const now = new Date();
  const date = String(now.getFullYear()) + String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0");
  const title = (document.getElementById("pagetitle").textContent || "acr-live-timing")
    .trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase();
  let htmlStem = "";
  try { htmlStem = decodeURIComponent(location.pathname.split("/").pop() || "").replace(/\.html?$/i, ""); }
  catch (_) { /* malformed URL encoding: use the title fallback */ }
  htmlStem = htmlStem.replace(/[\\/:*?"<>|]/g, "-").trim();
  const base = htmlStem || title || "acr-live-timing";
  const datedBase = /\d{8}/.test(base) ? base : base + "-" + date;
  const scope = activeTab === "stages"
    ? "stages-" + (ov.groupFilter == null ? "all" : pngExportScope())
    : "standings";
  const safeScope = scope.replace(/[\\/:*?\"<>|]/g, "-").trim();
  return datedBase + "-" + safeScope + "." + extension;
}
function downloadBlob(blob, extension) {
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.href = url; link.download = exportFilename(extension);
  link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadPng(blob) { downloadBlob(blob, "png"); }
function exportVisibleTableCsv(button) {
  const csv = tableCsv(visibleTableData());
  if (!csv) return;
  button.disabled = true;
  try {
    downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8" }), "csv");
    flashExportButton(button, "&#10003;", "CSV downloaded");
  } catch (error) {
    console.error("Could not export results CSV", error);
    button.title = "CSV export failed";
  } finally {
    button.disabled = false;
  }
}
async function exportVisibleTablePng(button) {
  button.disabled = true;
  try {
    const blob = await buildVisibleTablePng();
    if (!blob) return;
    downloadPng(blob);
    flashExportButton(button, "&#10003;", "PNG downloaded");
  } catch (error) {
    console.error("Could not export results PNG", error);
    button.title = "PNG export failed";
  } finally {
    button.disabled = false;
  }
}

// Shared PNG pipeline: the visible-page button downloads this blob, while the
// host's hidden WebView2 asks for the same blob to attach it to a Discord embed.
async function buildVisibleTablePng({ includeTitle = true } = {}) {
  const data = visibleTableData();
  if (!data.rows.length) return null;
  const flagSources = [...new Set(data.rows.map(row => row[1] && row[1].flag).filter(Boolean))];
  const loaded = await Promise.all(flagSources.map(async src => [src, await loadExportFlag(src)]));
  const flags = new Map(loaded.filter(([, image]) => image));
  const canvas = drawResultsPng(data, flags, includeTitle);
  return new Promise((resolve, reject) => canvas.toBlob(value =>
    value ? resolve(value) : reject(new Error("PNG encoding failed")), "image/png"));
}

// Deliberately small host bridge. It never receives the Discord webhook: it only
// returns the exact standings PNG already used by the page export, in forced dark
// mode so the Discord image is stable across the operator's local page settings.
window.acrLiveTimingExport = {
  async standingsPng() {
    if (!lastServer) throw new Error("No live state is available");
    activeTab = "standings";
    ov.theme = "dark";
    applyTheme("dark");
    syncThemeButton();
    render(displayedView(lastServer));
    await new Promise(requestAnimationFrame);
    const blob = await buildVisibleTablePng({ includeTitle: false });
    if (!blob) throw new Error("No standings with points to export");
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Could not read PNG"));
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  },
  async rallyPng(group) {
    if (!lastServer) throw new Error("No live state is available");
    if (!Number.isInteger(group) || group < 0) throw new Error("Invalid rally group");
    const all = lastServer.allStages || [];
    const groups = effGroups(lastServer);
    // Group 0 exports every stage of the host's published selection, exactly like
    // picking "All stages" in the page's rally selector.
    const selected = group === 0
      ? all.filter(stage => !hostDiscarded(lastServer).has(stage.id))
      : all.filter(stage => groups.get(stage.id) === group);
    if (!selected.length)
      throw new Error(group === 0 ? "There are no stages to export" : "The selected rally has no stages");
    // Match selecting this rally in the page: it becomes the visible stage set,
    // then the shared canvas exporter renders that board without its PNG title.
    activeTab = "stages";
    ov.groupFilter = group === 0 ? null : group;
    groupSelection = new Set(selected.map(stage => stage.id));
    ov.discarded = group === 0 ? null
      : new Set(all.filter(stage => !groupSelection.has(stage.id)).map(stage => stage.id));
    sortKey = "total";
    // Force the historical stage board: during Racing the page would otherwise
    // swap in the live sector board, which ignores the rally selection above.
    ov.hideSplits = true;
    ov.theme = "dark";
    applyTheme("dark");
    syncThemeButton();
    render(displayedView(lastServer));
    await new Promise(requestAnimationFrame);
    const blob = await buildVisibleTablePng({ includeTitle: false });
    if (!blob) throw new Error("No completed results in the selected rally");
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Could not read PNG"));
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    });
  }
};

// Poll /state on a short interval. Plain short GETs proxy reliably through
// Cloudflare Tunnel, unlike a long-lived SSE stream (HTTP/2 stream resets).
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch("/state", { cache: "no-store" });
    if (r.ok) applyServer(await r.json());
  } catch (_) { /* transient; retry next tick */ }
  finally { polling = false; }
}
syncThemeButton();
initPanel();
initScrollLayout();
// The server bakes the current state into #statecache, so first paint comes from it
// with no /state round-trip. A copy saved via the browser's "Save page as" opens as
// file:// with no server behind it: the baked state renders and the settings panel
// stays functional (recomputes are client-side) — so only poll when actually served.
const saved = readStateCache();
if (saved) applyServer(saved);
if (location.protocol !== "file:") {
  poll();
  setInterval(poll, 1000);
}
</script>
