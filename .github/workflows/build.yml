name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # PR builds require the IS_PUBLIC repo variable; forks/mirrors without it
    # can still build any branch manually via "Run workflow".
    if: github.event_name != 'pull_request' || vars.IS_PUBLIC == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ACRLiveTiming.csproj -c Release -nologo

      # Manual runs ("Run workflow") also produce a downloadable test exe. It keeps
      # the csproj's "-dev" suffix, and the commit sha baked into the version already
      # tells two test builds apart — and apart from a release (plain x.y.z).
      - name: Publish test exe
        if: github.event_name == 'workflow_dispatch'
        run: >
          dotnet publish ACRLiveTiming.csproj -c Release -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/fd

      # archive: false ships the exe as-is instead of wrapping it in a zip, so the
      # download needs no unpacking. The artifact then takes the file name and the
      # "name" input is ignored — the run number is on the run page anyway.
      - name: Upload test exe
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: publish/fd/ACRLiveTiming.exe
          retention-days: 7
          archive: false

  release:
    # Publish and attach binaries when a version tag (v1.2.3) is pushed,
    # unless the IS_PUBLIC repo variable is absent (forks/mirrors).
    if: startsWith(github.ref, 'refs/tags/v') && vars.IS_PUBLIC == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Publish (framework-dependent, needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish ACRLiveTiming.csproj -c Release -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -o publish/fd

      - name: Rename asset
        shell: pwsh
        run: Copy-Item publish/fd/ACRLiveTiming.exe "ACRLiveTiming-${{ env.VERSION }}-win-x64.exe"

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $file = "ACRLiveTiming-${{ env.VERSION }}-win-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File "$file.sha256" -Encoding ascii -NoNewline
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ACRLiveTiming-${{ env.VERSION }}-win-x64.exe
            ACRLiveTiming-${{ env.VERSION }}-win-x64.exe.sha256
          body: |
            **SHA-256** — `ACRLiveTiming-${{ env.VERSION }}-win-x64.exe`
            ```
            ${{ env.SHA256 }}
            ```
          generate_release_notes: true
